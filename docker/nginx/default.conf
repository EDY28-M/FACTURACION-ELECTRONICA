# Anti-DDoS / L7 flood rate & connection limiting (keyed by real client IP behind Caddy reverse proxy)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=app_limit:20m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php index.html index.htm;
    charset utf-8;

    # Hide exact Nginx version header
    server_tokens off;

    # Resolve real visitor IP forwarded by the reverse proxy (Caddy / Docker network)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Slowloris & abuse mitigation
    client_max_body_size 100M;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    limit_conn conn_limit 40;
    limit_req_status 429;
    limit_conn_status 429;

    # Browser & transport security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Compress text responses: app.js alone is ~2 MB raw and ~520 KB gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    # Strict brute-force / credential-stuffing rate limit on auth endpoints
    location ~* ^/(login|password|api/login)$ {
        limit_req zone=login_limit burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        limit_req zone=app_limit burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/storage/.*\.php$ {
        deny all;
    }

    location ~* ^/storage/.*\.svg$ {
        try_files $uri /index.php?$query_string;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static assets: Mix (?id=) and the theme files (?v=) change their URL on every build, so browsers can keep them.
    location ~* "\.(js|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|json)$" {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
