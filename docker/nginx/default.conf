server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;

    index index.php index.html index.htm;
    charset utf-8;

    client_max_body_size 100M;

    # Compress text responses: app.js alone is ~7 MB raw and well under 2 MB gzipped.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml font/ttf application/vnd.ms-fontobject;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static assets: Mix (?id=) and the theme files (?v=) change their URL on every build, so browsers can keep them.
    location ~* "\.(js|css|map|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|json)$" {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

