; High-concurrency PHP-FPM pool tuning for FacturacionPro (8 vCPU / 16 GB RAM host).
; Overrides the default Alpine PHP-FPM pool limit (pm.max_children = 5) so 400+ active
; users / concurrent cashiers do not queue behind 5 workers.
; Each worker uses ~35-55 MB RSS under OPcache; 50 workers cap PHP memory around ~2.5 GB.

[www]
pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 8
pm.max_spare_servers = 20
pm.process_idle_timeout = 10s
pm.max_requests = 500
