services:
  mariadb:
    image: mariadb:10.5
    container_name: facturador_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tenancy
    ports:
      - "3307:3306"
    volumes:
      - facturador_mariadb_data:/var/lib/mysql
    networks:
      - facturador_net

  fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: facturador_fpm
    restart: always
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - mariadb
    networks:
      - facturador_net

  web:
    image: nginx:alpine
    container_name: facturador_web
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fpm
    networks:
      - facturador_net

volumes:
  facturador_mariadb_data:

networks:
  facturador_net:
    driver: bridge

