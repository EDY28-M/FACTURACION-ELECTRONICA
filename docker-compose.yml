# Facturador stack (nginx + PHP-FPM + scheduler + MariaDB).
#
# Every value below can be overridden from the project .env (Compose reads it automatically).
# Defaults reproduce the original local setup: facturador_* containers, web on :8080, DB on :3307.
#   CONTAINER_PREFIX   container name prefix                (default: facturador)
#   WEB_PORT / WEB_BIND  published HTTP port / bind address   (default: 8080 / 0.0.0.0)
#   DB_HOST_PORT / DB_BIND  published MariaDB port / address  (default: 3307 / 127.0.0.1)
#   DB_PASSWORD        MariaDB root password (also used by the app)   (default: rootpassword)
# Set COMPOSE_PROJECT_NAME + CONTAINER_PREFIX + ports to run a second, isolated stack.

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  volumes:
    - ./:/var/www/html
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  networks:
    - facturador_net

services:
  mariadb:
    image: mariadb:10.5
    container_name: ${CONTAINER_PREFIX:-facturador}_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: tenancy
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - facturador_mariadb_data:/var/lib/mysql
    healthcheck:
      # A real authenticated query: unlike "mysqladmin ping", it fails on "access denied".
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - facturador_net

  fpm:
    <<: *app
    container_name: ${CONTAINER_PREFIX:-facturador}_fpm
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy

  # Runs the Laravel scheduler (tenancy:run tenant:run every minute, contracts:bill-recurrent daily 06:00 Lima).
  # It shares the project directory with fpm, so the file cache mutex (withoutOverlapping) is shared too.
  scheduler:
    <<: *app
    container_name: ${CONTAINER_PREFIX:-facturador}_scheduler
    restart: unless-stopped
    user: www-data
    command: ["sh", "-c", "until [ -f vendor/autoload.php ] && [ -r .env ]; do sleep 5; done; exec php artisan schedule:work"]
    depends_on:
      mariadb:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-facturador}_web
    restart: always
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fpm
    networks:
      - facturador_net

  # One-off JS build: docker compose --profile build run --rm node sh -c "npm ci --ignore-scripts --legacy-peer-deps && npm run production:js"
  node:
    image: node:24-bookworm-slim
    profiles: ["build"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      npm_config_fund: "false"
      npm_config_audit: "false"
      npm_config_update_notifier: "false"

volumes:
  facturador_mariadb_data:

networks:
  facturador_net:
    driver: bridge
